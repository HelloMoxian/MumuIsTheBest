<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="万物构成塔第二版临时原型：符文树、格子背包、永久知识与通用生成条件。" />
    <title>万物构成塔 · 第二版临时原型</title>
    <link rel="stylesheet" href="./world-tower-prototype-v2.css" />
    <script defer src="./world-tower-prototype-v2.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <button class="square-button back-button" type="button" aria-label="返回上一页">←</button>
        <span class="brand-orb" aria-hidden="true"></span>
        <div class="brand-copy">
          <strong>万物构成塔</strong>
          <span>第二版临时原型 · 不记录进度</span>
        </div>
      </div>
      <div class="slogan" id="slogan"></div>
      <div class="resource-bar">
        <div class="resource-pill"><span aria-hidden="true">✦</span><strong id="coinCount">320</strong><span>星币</span></div>
        <div class="resource-pill progress"><strong id="discoveryCount">0</strong><span>/ 25 点亮</span></div>
        <button class="square-button help-button" type="button" aria-label="玩法提示">?</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="world-panel glass-panel" aria-labelledby="worldTitle">
        <div class="world-toolbar">
          <div class="world-title">
            <small>万物的来路与去向</small>
            <h1 id="worldTitle">点击任意符文，观察整条关系</h1>
          </div>
          <div class="relation-legend" aria-label="关系亮度说明">
            <span class="legend-item current"><i></i>当前节点</span>
            <span class="legend-item source"><i></i>组成来路</span>
            <span class="legend-item future"><i></i>可去方向</span>
          </div>
        </div>
        <div class="map-viewport" id="mapViewport">
          <div class="world-map" id="worldMap">
            <canvas id="connectionCanvas" aria-hidden="true"></canvas>
            <div id="layerMarks" aria-hidden="true"></div>
            <div id="nodeLayer"></div>
            <aside class="node-inspector" id="nodeInspector" aria-live="polite"></aside>
          </div>
        </div>
      </section>

      <aside class="inventory-panel glass-panel" aria-labelledby="inventoryTitle">
        <div class="inventory-heading">
          <div><h2 id="inventoryTitle">星际背包</h2><p>格子悬停看说明，知识学会后永久保留</p></div>
          <span class="bag-capacity">63 格</span>
        </div>
        <section class="need-panel" id="needPanel" aria-labelledby="needTitle"></section>
        <div class="inventory-scroll">
          <section class="inventory-group">
            <h3 class="group-title">动作 <small>使用后可能消耗</small></h3>
            <div class="slot-grid" id="actionSlots"></div>
          </section>
          <section class="inventory-group">
            <h3 class="group-title">条件 <small>为变化提供力量</small></h3>
            <div class="slot-grid" id="conditionSlots"></div>
          </section>
          <section class="inventory-group">
            <h3 class="group-title">环境 <small>准备一次，持续可用</small></h3>
            <div class="slot-grid" id="environmentSlots"></div>
          </section>
          <section class="inventory-group">
            <h3 class="group-title">知识星图 <small>学会后永不消失</small></h3>
            <div class="slot-grid" id="knowledgeSlots"></div>
          </section>
        </div>
      </aside>
    </main>

    <div class="hover-tooltip" id="hoverTooltip" role="tooltip"></div>
    <div class="success-burst" id="successBurst" aria-hidden="true">新的符文<br />点亮啦！</div>
    <div class="sr-only" id="liveRegion" aria-live="polite"></div>
  </body>
</html>
