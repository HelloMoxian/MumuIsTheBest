<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0E0D2B"><title>星页数独 · 把星星拼成故事</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"><p class="boot">正在打开星页数独……</p></div><div id="status" role="status" aria-live="polite"></div><dialog id="setup" aria-labelledby="setup-title"></dialog><dialog id="help" aria-labelledby="help-title"><h2 id="help-title">一起拼一页故事</h2><p>每一行、每一列、每一个粗线框里，每种图案只能出现一次。先看图案的形状和样子，找到每一格的朋友。</p><ol><li>点一个空格，打开右侧工作台。</li><li>选“排除候选”，点图案打叉；再点一次可以恢复。</li><li>收起工作台，格子会留下问号和剩余候选的小图片。只剩一个时自动填上。</li><li>也可以选“直接填写”，先确定一个答案。用“撤销”或“重新考虑”修改。</li><li>每一行的图案都带着故事碎片，填对后就拼成一句完整的话。</li></ol><p>方向键移动格子；1—9 或 A—I 操作候选；Escape 收起；Backspace 清空。没有倒计时，也不会扣币。</p><button class="primary" id="close-help">我知道啦</button></dialog><script type="module" src="/app.mjs"></script></body></html>
